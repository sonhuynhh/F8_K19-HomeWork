  <body>
    <h1 style="color: aquamarine">ORDERS PAGE</h1>
    <!-- 
      Phần tử này có: 
        - id: special
        - class: title
        - style: color: blueviolet
        - tag: h2
      Slector thắng là inline vì do tính chất ưu tiên của css
      Màu hiển thị là blueviolet
    -->
    <h2 class="title" id="special" style="color: blueviolet">
      Danh sach don hang
    </h2>
    <div>
      <p style="color: beige">Don hang 001</p>
      <p style="color: bisque">Don hang 002</p>
      <p class="highlight">Don hang 003</p>
      <p class="highlight">Don hang 004</p>
    </div>
  </body>
