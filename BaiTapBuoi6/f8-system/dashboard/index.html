<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Dashboard</title>
    <link rel="stylesheet" href="../css/base.css" />
    <style>
      p {
        font-size: 50px;
      }
      h3 {
        font-size: 30px;
      }
    </style>
  </head>
  <body>
    <!-- 
      Phần tử này có: 
        - id: special
        - class: title
        - style: color: blueviolet
        - tag: h1
      Slector thắng là inline vì do tính chất ưu tiên của css
      Màu hiển thị là blueviolet
    -->
    <h1 class="title" id="special" style="color: blueviolet">DASHBOARD</h1>
    <h2 class="section">Tong quan he thong</h2>
    <div class="big">
      <h3 class="title">Courses</h3>
      <p class="highlight">10</p>
      <h3 class="title">Students</h3>
      <p class="highlight">100</p>
      <h3 class="title">Teachers</h3>
      <p class="highlight">10</p>
      <h3 class="title">Orders</h3>
      <p class="highlight">50</p>
      <h3 class="title">Reports</h3>
      <p class="highlight">5</p>
    </div>
  </body>
</html>
